<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Expense Tracker</h1>
    <p class="subtitle">FastAPI + MongoDB dashboard</p>
  </header>

  <div id="message" class="message hidden" role="status" aria-live="polite"></div>

  <main class="container">
    <section aria-labelledby="summary-title">
      <h2 id="summary-title">Overview</h2>
      <div class="stats">
        <article class="card stat"><span class="label">Total</span><strong id="stat-total">–</strong></article>
        <article class="card stat"><span class="label">Average</span><strong id="stat-average">–</strong></article>
        <article class="card stat"><span class="label">Highest</span><strong id="stat-highest">–</strong></article>
        <article class="card stat"><span class="label">Lowest</span><strong id="stat-lowest">–</strong></article>
      </div>
    </section>

    <section class="card" aria-labelledby="cat-title">
      <h2 id="cat-title">Category Summary</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Category</th><th class="num">Total</th><th class="num">Average</th></tr>
          </thead>
          <tbody id="category-body"></tbody>
        </table>
      </div>
    </section>

    <div class="two-col">
      <section class="card" aria-labelledby="user-title">
        <h2 id="user-title">Create User</h2>
        <form id="user-form">
          <label>Name
            <input type="text" id="user-name" required />
          </label>
          <label>Email
            <input type="email" id="user-email" required />
          </label>
          <button type="submit" class="btn primary">Create User</button>
        </form>
        <p id="user-result" class="hint"></p>
      </section>

      <section class="card" aria-labelledby="form-title">
        <h2 id="form-title">Add Expense</h2>
        <form id="expense-form">
          <input type="hidden" id="expense-id" />
          <label>Description
            <input type="text" id="description" required />
          </label>
          <div class="row">
            <label>Amount
              <input type="number" id="amount" step="0.01" min="0.01" required />
            </label>
            <label>Date
              <input type="date" id="date" required />
            </label>
          </div>
          <div class="row">
            <label>Category
              <input type="text" id="category" required />
            </label>
            <label>Payment Method
              <input type="text" id="payment_method" required />
            </label>
          </div>
          <label>User ID
            <input type="text" id="user_id" required />
          </label>
          <div class="actions">
            <button type="submit" class="btn primary" id="expense-submit">Add Expense</button>
            <button type="button" class="btn" id="expense-cancel" hidden>Cancel Edit</button>
          </div>
        </form>
      </section>
    </div>

    <section class="card" aria-labelledby="exp-title">
      <h2 id="exp-title">Expenses</h2>

      <form id="filter-form" class="filters">
        <label>User ID
          <input type="text" id="f-user" />
        </label>
        <label>Category
          <input type="text" id="f-category" />
        </label>
        <label>Min Amount
          <input type="number" id="f-min" step="0.01" min="0" />
        </label>
        <label>Max Amount
          <input type="number" id="f-max" step="0.01" min="0" />
        </label>
        <label>Sort By
          <select id="f-sort">
            <option value="date">Date</option>
            <option value="amount">Amount</option>
          </select>
        </label>
        <label>Order
          <select id="f-order">
            <option value="desc">Descending</option>
            <option value="asc">Ascending</option>
          </select>
        </label>
        <label>Per Page
          <select id="f-limit">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="25">25</option>
            <option value="50">50</option>
          </select>
        </label>
        <div class="actions">
          <button type="submit" class="btn primary">Apply</button>
          <button type="button" class="btn" id="filter-reset">Reset</button>
        </div>
      </form>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Description</th>
              <th class="num">Amount</th>
              <th>Category</th>
              <th>Payment</th>
              <th>Date</th>
              <th>User ID</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="expense-body"></tbody>
        </table>
      </div>

      <nav class="pagination" aria-label="Pagination">
        <button class="btn" id="prev-page">Previous</button>
        <span id="page-info">Page 1</span>
        <button class="btn" id="next-page">Next</button>
      </nav>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
